# XcodeGen spec. Generate the Xcode project with `xcodegen` (scripts/build.sh does it for you).
name: Zadur
options:
  bundleIdPrefix: io.github.booneynoobington
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ZadurCore:
    path: ZadurCore
  # Updates outside the App Store (MIT license).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The one place for the version (scripts/release.sh can override both).
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Zadur:
    type: application
    platform: macOS
    sources:
      - path: Zadur/Sources
      - path: Zadur/Resources
      # The app icon (AppIcon), straight from the icon kit.
      - path: Zadur-Icon-Kit/ZadurIcons.xcassets
      # Shipped inside the app: Zadur's license and the licenses of what it contains.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ZadurCore
      - package: Sparkle
      - target: ZadurThumbnail
      - target: ZadurPreview
    info:
      path: Zadur/Info.plist
      properties:
        CFBundleDisplayName: Zadur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        # Where "Problem melden" sends its mail; empty: the user fills in the address.
        ZadurSupportEmail: ""
        # Updates (Sparkle): the newest release's appcast.xml, signed with this public key's
        # private half (in the keychain of the Mac that builds releases; see docs/RELEASING.md).
        SUFeedURL: https://github.com/BooneyNoobington/stet/releases/latest/download/appcast.xml
        SUPublicEDKey: hHedyo+31pjNag7UtbIJVHEQh1mT3Bbh5/1KAq9VrUw=
        SUEnableAutomaticChecks: true
        # Timestamp services answer over plain http (their replies are signed); only these two.
        NSAppTransportSecurity:
          NSExceptionDomains:
            timestamp.digicert.com:
              NSExceptionAllowsInsecureHTTPLoads: true
            timestamp.sectigo.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        # .crea books (the open Crea format) are folders that Finder shows as single files (like
        # .app). Books from when Zadur was called Stet end in .stet and open the same way.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.crea-format.book
            UTTypeDescription: Crea-Buch
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeIconFile: ZadurBook
            UTTypeTagSpecification:
              public.filename-extension: [crea]
          - UTTypeIdentifier: io.github.booneynoobington.stet.book
            UTTypeDescription: Stet-Buch
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeIconFile: ZadurBook
            UTTypeTagSpecification:
              public.filename-extension: [stet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Crea-Buch
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            CFBundleTypeIconFile: ZadurBook
            LSItemContentTypes: [io.github.crea-format.book]
          - CFBundleTypeName: Stet-Buch
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            CFBundleTypeIconFile: ZadurBook
            LSItemContentTypes: [io.github.booneynoobington.stet.book]
    settings:
      base:
        # Still the old name's, on purpose: Sparkle only finds a renamed app by its identifier,
        # and settings, keychain access and books' file types hang on it.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.booneynoobington.stet
        PRODUCT_NAME: Zadur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
    preBuildScripts:
      - name: Build editor
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/editor"
          [ -d node_modules ] || npm install --no-audit --no-fund
          npm run --silent build
    postBuildScripts:
      - name: Copy editor into the app
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/editor"
          rsync -a --delete "$SRCROOT/editor/dist/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/editor/"
    scheme:
      gatherCoverageData: false

  # Finder icons: the book's cover, or a title page.
  ZadurThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Zadur/QuickLookThumbnail
      - path: Zadur/Shared
    dependencies:
      - package: ZadurCore
      - sdk: QuickLookThumbnailing.framework
    info:
      path: Zadur/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: Zadur-Miniaturen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [io.github.booneynoobington.stet.book, io.github.crea-format.book]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: Zadur/QuickLookThumbnail/ZadurThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base: &extensionSettings
        PRODUCT_BUNDLE_IDENTIFIER: io.github.booneynoobington.stet.thumbnail
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  # Space bar in Finder: title, contents, word counts, the opening pages.
  ZadurPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Zadur/QuickLookPreview
    dependencies:
      - package: ZadurCore
      - sdk: QuickLookUI.framework
    info:
      path: Zadur/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: Zadur-Vorschau
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [io.github.booneynoobington.stet.book, io.github.crea-format.book]
            QLSupportsSearchableItems: false
    entitlements:
      path: Zadur/QuickLookPreview/ZadurPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        <<: *extensionSettings
        PRODUCT_BUNDLE_IDENTIFIER: io.github.booneynoobington.stet.preview
