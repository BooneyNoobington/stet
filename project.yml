# XcodeGen spec. Generate the Xcode project with `xcodegen` (scripts/build.sh does it for you).
name: Stet
options:
  bundleIdPrefix: io.github.booneynoobington
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  StetCore:
    path: StetCore
  # Updates outside the App Store (MIT license).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The one place for the version (scripts/release.sh can override both).
    MARKETING_VERSION: "0.9.2"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Stet:
    type: application
    platform: macOS
    sources:
      - path: Stet/Sources
      - path: Stet/Resources
      # Shipped inside the app: Stet's license and the licenses of what it contains.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: StetCore
      - package: Sparkle
      - target: StetThumbnail
      - target: StetPreview
    info:
      path: Stet/Info.plist
      properties:
        CFBundleDisplayName: Stet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        CFBundleIconFile: Stet
        # Where "Problem melden" sends its mail; empty: the user fills in the address.
        StetSupportEmail: ""
        # Updates (Sparkle): the newest release's appcast.xml, signed with this public key's
        # private half (in the keychain of the Mac that builds releases; see docs/RELEASING.md).
        SUFeedURL: https://github.com/BooneyNoobington/stet/releases/latest/download/appcast.xml
        SUPublicEDKey: hHedyo+31pjNag7UtbIJVHEQh1mT3Bbh5/1KAq9VrUw=
        SUEnableAutomaticChecks: true
        # Timestamp services answer over plain http (their replies are signed); only these two.
        NSAppTransportSecurity:
          NSExceptionDomains:
            timestamp.digicert.com:
              NSExceptionAllowsInsecureHTTPLoads: true
            timestamp.sectigo.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        # .stet books are folders that Finder shows as single files (like .app).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.booneynoobington.stet.book
            UTTypeDescription: Stet-Buch
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeIconFile: StetBook
            UTTypeTagSpecification:
              public.filename-extension: [stet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Stet-Buch
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            CFBundleTypeIconFile: StetBook
            LSItemContentTypes: [io.github.booneynoobington.stet.book]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.booneynoobington.stet
        PRODUCT_NAME: Stet
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
    preBuildScripts:
      - name: Build editor
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/editor"
          [ -d node_modules ] || npm install --no-audit --no-fund
          npm run --silent build
    postBuildScripts:
      - name: Copy editor into the app
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/editor"
          rsync -a --delete "$SRCROOT/editor/dist/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/editor/"
    scheme:
      gatherCoverageData: false

  # Finder icons: the book's cover, or a title page.
  StetThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Stet/QuickLookThumbnail
      - path: Stet/Shared
    dependencies:
      - package: StetCore
      - sdk: QuickLookThumbnailing.framework
    info:
      path: Stet/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: Stet-Miniaturen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [io.github.booneynoobington.stet.book]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: Stet/QuickLookThumbnail/StetThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base: &extensionSettings
        PRODUCT_BUNDLE_IDENTIFIER: io.github.booneynoobington.stet.thumbnail
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  # Space bar in Finder: title, contents, word counts, the opening pages.
  StetPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Stet/QuickLookPreview
    dependencies:
      - package: StetCore
      - sdk: QuickLookUI.framework
    info:
      path: Stet/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: Stet-Vorschau
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [io.github.booneynoobington.stet.book]
            QLSupportsSearchableItems: false
    entitlements:
      path: Stet/QuickLookPreview/StetPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        <<: *extensionSettings
        PRODUCT_BUNDLE_IDENTIFIER: io.github.booneynoobington.stet.preview
